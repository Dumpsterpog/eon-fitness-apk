name: eon_fitness
description: "Eon Fitness - level up your fitness. A Solo-Leveling-inspired fitness quest tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-400-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: CinzelDecorative
      fonts:
        - asset: assets/fonts/CinzelDecorative-700.ttf
          weight: 700
        - asset: assets/fonts/CinzelDecorative-900.ttf
          weight: 900
