# Push this project to a GitHub repo. Every push to main builds a release APK
# and publishes it at  https://github.com/<you>/<repo>/releases/latest
# Open that page on your phone and tap EonFitness.apk to download and install.
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android build files for this Flutter version
        run: flutter create --platforms=android --org com.atharva --project-name eon_fitness .

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # Universal APK: arm64-v8a + armeabi-v7a + x86_64, so it installs on
      # practically every Android phone (Android 7.0+).
      - run: flutter build apk --release

      - run: cp build/app/outputs/flutter-apk/app-release.apk EonFitness.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EonFitness-apk
          path: EonFitness.apk

      - name: Publish to Releases (phone-friendly download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Eon Fitness build ${{ github.run_number }}
          make_latest: true
          files: EonFitness.apk
